services:
  py-infinity:
    build: .
    image: ghcr.io/brettonw/py-infinity:development
    container_name: py-infinity
    hostname: py-infinity
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "3000:3000"
    environment:
      PY_INFINITY_CONFIG: /config/py-infinity.json
    secrets:
      - mqtt_password
    volumes:
      - ./config.json:/config/py-infinity.json:ro
      - py-infinity-data:/data

secrets:
  mqtt_password:
    file: ./mqtt-password.txt

volumes:
  py-infinity-data:
