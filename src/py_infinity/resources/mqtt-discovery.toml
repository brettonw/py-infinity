schema_version = 1

[device]
identifier_prefix = "py_infinity"
manufacturer = "Carrier/Bryant"
default_model = "Infinity/Evolution HVAC"

[origin]
name = "py-infinity"
support_url = "https://github.com/brettonw/py-infinity"

[availability]
payload_available = "online"
payload_not_available = "offline"
qos = 1

[[zone_components]]
id = "temperature"
field = "current_temperature"

[zone_components.attributes]
platform = "sensor"
name = "{zone_name} Temperature"
device_class = "temperature"
state_class = "measurement"
unit_of_measurement = "{temperature_unit}"

[[zone_components]]
id = "target"
field = "target_temperature"

[zone_components.attributes]
platform = "sensor"
name = "{zone_name} Target Temperature"
device_class = "temperature"
unit_of_measurement = "{temperature_unit}"

[[zone_components]]
id = "mode"
field = "mode"

[zone_components.attributes]
platform = "sensor"
name = "{zone_name} HVAC Mode"
icon = "mdi:thermostat"

[[zone_components]]
id = "action"
field = "action"

[zone_components.attributes]
platform = "sensor"
name = "{zone_name} HVAC Action"
icon = "mdi:hvac"

[[zone_components]]
id = "humidity"
field = "current_humidity"
optional = true

[zone_components.attributes]
platform = "sensor"
name = "{zone_name} Humidity"
device_class = "humidity"
state_class = "measurement"
unit_of_measurement = "%"
